<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Felix Agents style frame</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080d13;
    --bg-hub: #0f1b26;
    --panel: #0d141c;
    --card: #121c26;
    --line: rgba(160, 200, 220, 0.11);
    --line-strong: rgba(160, 200, 220, 0.22);
    --text: #e6eef4;
    --muted: #8496a5;
    --faint: #4a5a68;
    --cyan: hsl(192, 90%, 46%);
    --cyan-soft: hsla(192, 90%, 46%, 0.16);
    --result: hsl(190, 85%, 74%);
    --violet: #a48cff;
    --amber: #ffb547;
    --red: #ff4d5e;
    --node: #101a24;
    --mark-bg: #ffffff;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #f3f6f9;
    --bg-hub: #e6eff5;
    --panel: #ffffff;
    --card: #f7fafc;
    --line: rgba(20, 50, 70, 0.10);
    --line-strong: rgba(20, 50, 70, 0.2);
    --text: #0e1a24;
    --muted: #566877;
    --faint: #a7b4be;
    --cyan: hsl(192, 90%, 40%);
    --cyan-soft: hsla(192, 90%, 40%, 0.12);
    --result: hsl(192, 75%, 56%);
    --violet: #6f4fe0;
    --amber: #d48300;
    --red: #e0233a;
    --node: #ffffff;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 500 13px/1.4 Inter, system-ui, sans-serif; overflow: hidden; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
  header { height: 56px; display: flex; align-items: center; gap: 14px; padding: 0 18px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; letter-spacing: 0.01em; white-space: nowrap; }
  .brand img { width: 36px; height: 36px; object-fit: contain; }
  .sep { width: 1px; height: 26px; background: var(--line-strong); }
  .run { min-width: 0; display: flex; flex-direction: column; }
  .run b { font-weight: 600; font-size: 14px; white-space: nowrap; }
  .run span { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .runid { color: var(--cyan); background: var(--cyan-soft); border-radius: 6px; padding: 2px 7px; font-size: 12px; }
  .stats { margin-left: auto; display: flex; gap: 22px; align-items: center; }
  .stat { display: flex; flex-direction: column; align-items: flex-end; }
  .stat small { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
  .stat b { font: 600 15px "JetBrains Mono", monospace; }
  .stat b i { font-style: normal; color: var(--muted); font-weight: 500; }
  .stat b em { font-style: normal; color: var(--amber); }
  button { font: inherit; color: inherit; background: transparent; border: 1px solid var(--line-strong); border-radius: 8px; height: 30px; padding: 0 10px; cursor: pointer; }
  button:hover { border-color: var(--cyan); }
  button.on { background: var(--cyan); border-color: var(--cyan); color: #fff; }
  #theme { width: 34px; padding: 0; font-size: 15px; }
  main { position: relative; height: calc(100% - 56px - 180px); }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; cursor: default; }
  footer { height: 180px; border-top: 1px solid var(--line); background: var(--panel); padding: 10px 18px 12px; display: flex; flex-direction: column; gap: 8px; }
  .controls { display: flex; align-items: center; gap: 8px; }
  #play { width: 34px; padding: 0; font-size: 13px; }
  .speeds { display: flex; gap: 4px; }
  .speeds button { font: 500 12px "JetBrains Mono", monospace; padding: 0 8px; }
  .clock { font: 500 14px "JetBrains Mono", monospace; margin-left: 8px; }
  .clock i { font-style: normal; color: var(--muted); }
  .legend { margin-left: auto; display: flex; gap: 14px; color: var(--muted); font-size: 12px; align-items: center; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sh { width: 9px; height: 9px; display: inline-block; }
  .sh.task { background: var(--cyan); border-radius: 2px; }
  .sh.res { background: var(--result); border-radius: 50%; }
  .sh.msg { background: var(--violet); transform: rotate(45deg) scale(0.85); }
  .sh.amb { background: var(--amber); border-radius: 2px; }
  .sh.ref { background: var(--red); border-radius: 50%; }
  #timeline { flex: 1; width: 100%; min-height: 0; cursor: pointer; display: block; }
  #panel { position: absolute; top: 14px; right: 14px; width: 380px; max-height: calc(100% - 28px); overflow: auto; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 12px; padding: 14px 16px; box-shadow: 0 18px 50px rgba(0,0,0,0.35); display: none; }
  #panel.open { display: block; }
  #panel h3 { margin: 0 0 2px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
  #panel h3 button { height: 24px; width: 24px; padding: 0; }
  #panel .meta { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  #panel dl { display: grid; grid-template-columns: 92px 1fr; gap: 4px 10px; margin: 0 0 10px; font-size: 12px; }
  #panel dt { color: var(--muted); }
  #panel dd { margin: 0; font-family: "JetBrains Mono", monospace; overflow-wrap: anywhere; }
  #panel details { border-top: 1px solid var(--line); padding: 8px 0; }
  #panel summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  #panel pre { white-space: pre-wrap; font: 11.5px/1.5 "JetBrains Mono", monospace; margin: 8px 0 0; padding: 10px; border-radius: 8px; background: var(--card); max-height: 220px; overflow: auto; }
  #panel .note { color: var(--muted); font-size: 11px; margin-top: 6px; }
  @media (max-width: 760px) {
    header { padding: 0 12px; gap: 10px; }
    .brand span, .sep, .run span, .stat.hide-sm, .legend, .runid { display: none; }
    .brand img { width: 30px; height: 30px; }
    .run b { font-size: 13px; }
    .stat small { font-size: 9.5px; white-space: nowrap; }
    .stat b { font-size: 13px; }
    .stats { gap: 12px; }
    footer { padding: 8px 12px 10px; }
    .speeds button { padding: 0 6px; }
    #panel { left: 12px; right: 12px; width: auto; }
  }
</style>
</head>
<body>
<header>
  <div class="brand"><img src="../docs/brand/felix-agents-mark.png" alt=""><span>Felix Agents</span></div>
  <div class="sep"></div>
  <div class="run"><b id="runTitle">Review PR #482</b><span id="runGoal"></span></div>
  <span class="runid mono" id="runId"></span>
  <div class="stats">
    <div class="stat"><small>Workers</small><b id="sWorkers">0</b></div>
    <div class="stat hide-sm"><small>Tasks</small><b id="sTasks">0</b></div>
    <div class="stat"><small>Budget left</small><b id="sBudget">$0</b></div>
    <button id="theme" title="Toggle theme" aria-label="Toggle theme">◐</button>
  </div>
</header>
<main>
  <canvas id="scene"></canvas>
  <div id="panel" role="dialog" aria-label="Step detail"></div>
</main>
<footer>
  <div class="controls">
    <button id="play" aria-label="Play">▶</button>
    <div class="speeds" id="speeds"></div>
    <div class="clock" id="clock">00:00.0</div>
    <div class="legend">
      <span><i class="sh task"></i>task</span>
      <span><i class="sh res"></i>result</span>
      <span><i class="sh msg"></i>message</span>
      <span><i class="sh amb"></i>recovered</span>
      <span><i class="sh ref"></i>refused</span>
    </div>
  </div>
  <canvas id="timeline"></canvas>
</footer>
<script type="module">
const FLIGHT = 0.6;      // wall seconds per flight, at any speed
const MERGE = 0.25;      // same-edge window, wall seconds
const FLOW_AT = 150;     // packets in flight before busy edges become flow lines
const VIS = 90;          // claim visibility timeout
const SPEEDS = [1, 4, 8, 16];

const params = new URLSearchParams(location.search);
const root = document.documentElement;
const reduced = params.get('motion') === 'reduced' || matchMedia('(prefers-reduced-motion: reduce)').matches;
const theme = params.get('theme') || localGet('fa-theme') || 'dark';
root.dataset.theme = theme;

const fx = await (await fetch(params.get('fixture') || 'fixture-run.json')).json();
const mark = new Image();
mark.src = '../docs/brand/felix-agents-mark.png';
await Promise.all([
  mark.decode().catch(() => {}),
  document.fonts.load('600 13px Inter'), document.fonts.load('500 12px Inter'), document.fonts.load('700 13px Inter'),
  document.fonts.load('500 11px "JetBrains Mono"'), document.fonts.load('600 12px "JetBrains Mono"'),
]).catch(() => {});

function localGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function localSet(k, v) { try { localStorage.setItem(k, v); } catch {} }

// ---------- preparation: derived events (lapsed claims) and flights ----------

const recs = fx.records;
const END = recs[recs.length - 1].t + 2;
const events = [];
{
  const claims = new Map();
  const lapseBefore = (t) => {
    for (const [task, c] of [...claims]) {
      if (c.deadline < t) {
        events.push({ t: c.deadline, kind: 'lapse', task, pub: c.holder, o: null, derived: true, attempt: c.attempt });
        claims.delete(task);
      }
    }
  };
  for (const r of recs) {
    lapseBefore(r.t);
    events.push(r);
    if (r.kind === 'task_claimed') claims.set(r.task, { holder: r.pub, deadline: r.deadline, attempt: r.attempt });
    else if (r.kind === 'task_extended') { const c = claims.get(r.task); if (c && c.holder === r.pub) c.deadline = r.deadline; }
    else if (['task_done', 'task_released', 'task_dead'].includes(r.kind)) { const c = claims.get(r.task); if (c && c.holder === r.pub) claims.delete(r.task); }
  }
  lapseBefore(Infinity);
  events.sort((a, b) => a.t - b.t || (a.o ?? -1) - (b.o ?? -1));
}

// Slot order and card order are fixed by first appearance, so they never move.
const slotOf = new Map();
const cardOrder = [];
for (const e of events) {
  if (e.kind === 'agent_up' && e.agent !== 'planner' && !slotOf.has(e.agent)) slotOf.set(e.agent, slotOf.size);
  if (e.key && e.kind !== 'refused' && !cardOrder.includes(e.key)) cardOrder.push(e.key);
}
if (!cardOrder.includes('plan-review')) cardOrder.unshift('plan-review');
const SLOTS = Math.max(8, slotOf.size);
const postedT = new Map();
const bursts = [];
let firstPost = Infinity;
for (const e of events) {
  if (e.kind !== 'task_posted') continue;
  if (!postedT.has(e.task)) postedT.set(e.task, e.t);
  firstPost = Math.min(firstPost, e.t);
  const b = bursts[bursts.length - 1];
  if (b && e.t - b.t1 < 2) { b.n++; b.t1 = e.t; } else bursts.push({ t: e.t, t1: e.t, n: 1 });
}

const rawFlights = [];
{
  const alive = new Set();
  for (const e of events) {
    const f = (from, to, cls, extra = {}) => rawFlights.push({ t: e.t, from, to, cls, ev: e, ...extra });
    switch (e.kind) {
      case 'agent_up': if (e.agent !== 'planner') alive.add(e.agent); break;
      case 'agent_gone': alive.delete(e.agent); break;
      case 'task_posted': f('planner', 'queue', 'post'); break;
      case 'task_claimed': f('queue', e.pub, 'claim'); break;
      case 'lapse': f(e.pub, 'queue', 'back'); break;
      case 'task_released': f(e.pub, 'queue', 'back'); break;
      case 'task_done': f(e.pub, 'planner', 'result'); break;
      case 'task_duplicate': f(e.pub, 'planner', 'dup'); break;
      case 'task_dead': f(e.pub, 'queue', 'dead'); break;
      case 'board_put': if (e.pub !== 'planner') f(e.pub, 'card:' + e.key, 'write'); break;
      case 'board_conflict': f(e.pub, 'card:' + e.key, 'conflict'); break;
      case 'refused': f(e.pub, e.key ? 'card:' + e.key : 'hub', 'refused'); break;
      case 'message':
        if (e.to === 'all') for (const w of alive) { if (w !== e.pub) f(e.pub, w, 'msg'); }
        else f(e.pub, e.to, 'msg');
        break;
    }
  }
}

// Same edge, same window: one packet with a count. Recomputed when speed changes.
const flightCache = new Map();
function flightsFor(speed) {
  speed = Math.round(speed * 2) / 2;
  if (flightCache.has(speed)) return flightCache.get(speed);
  const win = MERGE * speed;
  const groups = new Map();
  const out = [];
  for (const f of rawFlights) {
    const mergeable = !['refused', 'conflict', 'dead', 'dup'].includes(f.cls);
    const k = `${f.from}|${f.to}|${f.cls}`;
    const g = mergeable && groups.get(k);
    if (g && f.t - g.t < win) { g.n++; continue; }
    const m = { ...f, n: 1 };
    groups.set(k, m);
    out.push(m);
  }
  flightCache.set(speed, out);
  return out;
}

// ---------- the fold ----------

function fold(T) {
  const s = {
    agents: new Map(), queue: [], tasks: new Map(), board: new Map(),
    budget: fx.budget, spent: 0, reserved: new Map(), done: 0, dead: 0, dup: 0,
    posted: 0, ended: false, last: null, notes: [], refused: 0,
  };
  const ag = (n) => {
    if (!s.agents.has(n)) s.agents.set(n, { name: n, up: null, gone: null, task: null, lost: null, deadline: 0, claimT: 0, thinking: null, spent: 0, refused: 0, refusedT: -1e9, done: 0, upT: 0, goneT: 0 });
    return s.agents.get(n);
  };
  const card = (k) => {
    if (!s.board.has(k)) s.board.set(k, { key: k, text: null, v: null, writer: null, lock: null, putT: -1e9, conflictT: -1e9, lostT: -1e9, refusedT: -1e9 });
    return s.board.get(k);
  };
  const note = (e, tone, text) => s.notes.push({ t: e.t, tone, text });
  for (const e of events) {
    if (e.t > T) break;
    if (e.o != null) s.last = e;
    const t = e.t;
    switch (e.kind) {
      case 'run_started': s.budget = e.budget; break;
      case 'run_ended': s.ended = true; note(e, 'cyan', `Run ended: ${e.outcome}`); break;
      case 'agent_up': { const a = ag(e.agent); a.up = true; a.gone = null; a.upT = t; if (e.agent !== 'planner' && postedT.size && e.t > firstPost) note(e, 'cyan', `${e.agent} joins and takes the next free slot`); break; }
      case 'agent_gone': { const a = ag(e.agent); a.gone = t; a.goneT = t; note(e, 'amber', `${e.agent} is gone: its presence expired` + (a.task ? `. ${a.task} stays claimed until its deadline` : '')); break; }
      case 'task_posted': s.queue.push(e.task); s.tasks.set(e.task, { state: 'queued', attempt: 0 }); s.posted++; break;
      case 'task_claimed': {
        s.queue = s.queue.filter((x) => x !== e.task);
        s.tasks.set(e.task, { state: 'held', holder: e.pub, attempt: e.attempt });
        const a = ag(e.pub); a.task = e.task; a.lost = null; a.claimT = t; a.deadline = e.deadline;
        if (e.attempt > 1) note(e, 'cyan', `${e.pub} claims ${e.task}, attempt ${e.attempt}`);
        break;
      }
      case 'task_extended': { const a = ag(e.pub); if (a.task === e.task) a.deadline = e.deadline; break; }
      case 'lapse': case 'task_released': {
        s.queue.unshift(e.task);
        s.tasks.set(e.task, { state: 'queued', attempt: e.attempt });
        const a = ag(e.pub); if (a.task === e.task) { a.task = null; if (!a.gone) a.lost = e.task; }
        note(e, 'amber', e.kind === 'lapse' ? `${e.task}: ${e.pub}'s claim lapsed, back in the queue` : `${e.pub} hands ${e.task} back: ${e.reason}`);
        break;
      }
      case 'task_done': { s.done++; s.tasks.set(e.task, { state: 'done' }); const a = ag(e.pub); a.done++; if (a.task === e.task) a.task = null; break; }
      case 'task_duplicate': { s.dup++; const a = ag(e.pub); if (a.lost === e.task) a.lost = null; note(e, 'amber', `${e.pub} finishes ${e.task} late: duplicate, first result kept`); break; }
      case 'task_dead': { s.dead++; s.tasks.set(e.task, { state: 'dead' }); const a = ag(e.pub); if (a.task === e.task) a.task = null; note(e, 'amber', `${e.task} dead-lettered: ${e.reason}`); break; }
      case 'board_put': { const c = card(e.key); c.text = e.text; c.v = e.o; c.writer = e.pub; c.putT = t; break; }
      case 'board_conflict': { const c = card(e.key); c.conflictT = t; c.conflictBy = e.pub; note(e, 'amber', `${e.pub} writes ${e.key} at a stale version: refused, sees v${c.v}`); break; }
      case 'lease_taken': { const c = card(e.key); c.lock = { holder: e.pub, t, ttl: e.ttl, v: e.o }; break; }
      case 'lease_renewed': { const c = card(e.key); if (c.lock) { c.lock.t = t; c.lock.v = e.o; } break; }
      case 'lease_released': { const c = card(e.key); c.lock = null; break; }
      case 'lease_lost': { const c = card(e.key); c.lock = null; c.lostT = t; note(e, 'amber', `Lease on ${e.key} expired: ${e.holder} stopped renewing`); break; }
      case 'message': if (e.to === 'all') note(e, 'violet', `${e.pub} to all: “${e.text}” (sent as ${e.pub})`); break;
      case 'model_started': { const a = ag(e.agent); a.thinking = { t, reserve: e.reserve }; s.reserved.set(e.agent, (s.reserved.get(e.agent) || 0) + e.reserve); break; }
      case 'model_call': {
        const a = ag(e.agent); const r = a.thinking ? a.thinking.reserve : 0; a.thinking = null; a.lastTokens = e.tokens;
        s.reserved.set(e.agent, Math.max(0, (s.reserved.get(e.agent) || 0) - r));
        s.spent += e.cost; a.spent += e.cost;
        break;
      }
      case 'refused': {
        s.refused++;
        const a = ag(e.pub); a.refused++; a.refusedT = t;
        if (e.key) card(e.key).refusedT = t;
        note(e, 'red', `Refused: ${e.pub} ${e.op === 'task_post' ? 'posting tasks' : 'writing ' + e.key}. ${e.error}`);
        break;
      }
    }
  }
  s.reservedSum = [...s.reserved.values()].reduce((x, y) => x + y, 0);
  s.left = Math.max(0, s.budget - s.spent - s.reservedSum);
  for (const b of bursts) if (b.t <= T && b.n > 1) s.notes.push({ t: b.t, tone: 'cyan', text: `Planner posts ${b.n} tasks in ${Math.max(0.1, b.t1 - b.t).toFixed(1)} s` });
  s.notes.sort((a, b) => a.t - b.t);
  return s;
}

// ---------- palette and layout ----------

let C = {};
function readPalette() {
  const cs = getComputedStyle(root);
  for (const k of ['bg', 'bg-hub', 'panel', 'card', 'line', 'line-strong', 'text', 'muted', 'faint', 'cyan', 'cyan-soft', 'result', 'violet', 'amber', 'red', 'node']) C[k] = cs.getPropertyValue('--' + k).trim();
  C.dark = root.dataset.theme !== 'light';
}
readPalette();

const scene = document.getElementById('scene');
const sctx = scene.getContext('2d');
const tl = document.getElementById('timeline');
const tctx = tl.getContext('2d');
let L = {};
const DPR = Math.min(window.devicePixelRatio || 1, 2);

function layout() {
  const W = scene.clientWidth, H = scene.clientHeight;
  for (const [cv, w, h] of [[scene, W, H], [tl, tl.clientWidth, tl.clientHeight]]) { cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR); }
  const narrow = W < 760;
  const boardW = narrow ? W : Math.min(420, Math.max(340, W * 0.27));
  const swarmW = narrow ? W : W - boardW;
  const swarmH = narrow ? Math.min(H * 0.62, W * 1.05) : H;
  const cx = swarmW / 2 + (narrow ? 0 : Math.min(70, swarmW * 0.06)), cy = swarmH / 2 + (narrow ? 0 : 4);
  const R = Math.min(swarmW * 0.5 - (narrow ? 40 : 150), swarmH * 0.5 - (narrow ? 38 : 70));
  const hub = Math.max(60, Math.min(118, R * 0.42));
  // Up to 32 workers on one ring; past that two, the inner one offset by half a slot.
  const rings = SLOTS > 32 ? 2 : 1;
  const per = Math.ceil(SLOTS / rings);
  const spacing = (2 * Math.PI * R * (rings > 1 ? 0.8 : 1)) / per;
  const nodeR = SLOTS > 16 ? clamp(spacing * 0.36, 7, 16) : narrow ? 17 : Math.max(20, Math.min(28, R * 0.1));
  const slots = [];
  for (let i = 0; i < SLOTS; i++) {
    const ring = i % rings, k = Math.floor(i / rings);
    const a = -Math.PI / 2 + ((k + ring * 0.5) * 2 * Math.PI) / per;
    const rr = ring ? R * 0.8 : R;
    slots.push({ x: cx + Math.cos(a) * rr, y: cy + Math.sin(a) * rr, a });
  }
  const bx = narrow ? 10 : swarmW + 4, by = narrow ? swarmH + 46 : 16;
  const bw = narrow ? W - 20 : boardW - 22;
  L = { W, H, narrow, boardW, swarmW, swarmH, cx, cy, R, hub, nodeR, slots, bx, by, bw,
        planner: { x: cx, y: cy - hub * 0.36 }, tray: { x: cx, y: cy + hub * 0.3 },
        cardH: narrow ? 34 : 40, cardGap: narrow ? 4 : 5 };
  L.cardsTop = by + (narrow ? 26 : 30);
  L.logRows = narrow ? 0 : Math.max(3, Math.min(8, Math.floor((H - L.cardsTop - cardOrder.length * (L.cardH + L.cardGap) - 52) / 18)));
  L.logTop = H - L.logRows * 18 - 30;
  L.maxCards = Math.max(1, Math.floor(((narrow ? H : L.logTop - 18) - L.cardsTop) / (L.cardH + L.cardGap)));
}

function pos(id) {
  if (id === 'planner') return L.planner;
  if (id === 'queue') return L.tray;
  if (id === 'hub') return { x: L.cx, y: L.cy };
  if (id.startsWith('card:')) {
    const keys = cardOrder.filter((k) => cur && cur.board.has(k));
    const skip = Math.max(0, keys.length - L.maxCards);
    const vis = clamp(keys.indexOf(id.slice(5)) - skip, 0, L.maxCards - 1);
    return { x: L.bx + 6, y: L.cardsTop + vis * (L.cardH + L.cardGap) + L.cardH / 2, card: true };
  }
  const s = L.slots[slotOf.get(id) ?? 0];
  return s;
}

function edge(from, to, cls) {
  let a = pos(from), b = pos(to);
  const ws = (id) => slotOf.has(id);
  if (ws(from) && ws(to)) {
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    return { a, b, c: { x: mx + (L.cx - mx) * 0.6, y: my + (L.cy - my) * 0.6 } };
  }
  if (b.card || a.card) {
    const c = { x: Math.max(a.x, b.x) - 120, y: b.card ? b.y : a.y };
    return { a, b, c };
  }
  if (to === 'hub') {
    const dx = a.x - L.cx, dy = a.y - L.cy, d = Math.hypot(dx, dy);
    b = { x: L.cx + (dx / d) * (L.hub + 4), y: L.cy + (dy / d) * (L.hub + 4) };
  }
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  if (cls === 'back' || cls === 'dead') {
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
    return { a, b, c: { x: mx - (dy / d) * d * 0.45, y: my + (dx / d) * d * 0.45 } };
  }
  return { a, b, c: { x: mx, y: my } };
}

const bez = (e, p) => {
  const q = 1 - p;
  return { x: q * q * e.a.x + 2 * q * p * e.c.x + p * p * e.b.x, y: q * q * e.a.y + 2 * q * p * e.c.y + p * p * e.b.y };
};
const ease = (p) => (p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const money = (x) => '$' + x.toFixed(2);
const mmss = (t) => { const m = Math.floor(t / 60), s = t - m * 60; return String(m).padStart(2, '0') + ':' + s.toFixed(1).padStart(4, '0'); };
const base = (p) => p.split('/').pop();

function alpha(col, a) {
  if (col.startsWith('hsl(')) return col.replace('hsl(', 'hsla(').replace(')', `, ${a})`);
  if (col.startsWith('#')) {
    const n = parseInt(col.slice(1), 16);
    return `rgba(${n >> 16}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
  }
  return col;
}

// ---------- drawing ----------

let hits = [];
let cur = null;
let WALL = 0;
let wallNow = null;

function drawScene(T, speed) {
  const ctx = sctx;
  const s = fold(T);
  cur = s;
  WALL = wallNow ?? T / speed;
  const w = FLIGHT * speed;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, L.W, L.H);
  hits = [];

  // backdrop
  const g = ctx.createRadialGradient(L.cx, L.cy, 0, L.cx, L.cy, L.R * 1.4);
  g.addColorStop(0, C.dark ? 'rgba(20, 120, 150, 0.10)' : 'rgba(20, 140, 170, 0.07)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, L.swarmW, L.swarmH);
  ctx.fillStyle = C.line;
  for (let x = 16; x < L.swarmW; x += 28) for (let y = 16; y < L.swarmH; y += 28) ctx.fillRect(x, y, 1, 1);

  // ring guide and spokes
  ctx.strokeStyle = C.line;
  ctx.lineWidth = 1;
  ctx.setLineDash([2, 6]);
  ctx.beginPath(); ctx.arc(L.cx, L.cy, L.R, 0, Math.PI * 2); ctx.stroke();
  if (SLOTS > 32) { ctx.beginPath(); ctx.arc(L.cx, L.cy, L.R * 0.8, 0, Math.PI * 2); ctx.stroke(); }
  ctx.setLineDash([]);
  for (const [name, i] of slotOf) {
    const a = s.agents.get(name);
    if (!a || !a.up) continue;
    const sl = L.slots[i];
    const dx = Math.cos(sl.a), dy = Math.sin(sl.a);
    const live = !a.gone;
    ctx.strokeStyle = live ? (a.task ? alpha(C.cyan, 0.32) : C['line-strong']) : C.line;
    ctx.lineWidth = a.task && live ? 1.5 : 1;
    ctx.beginPath();
    ctx.moveTo(L.cx + dx * (L.hub + 6), L.cy + dy * (L.hub + 6));
    const sd = Math.hypot(sl.x - L.cx, sl.y - L.cy);
    ctx.lineTo(L.cx + dx * (sd - L.nodeR - 6), L.cy + dy * (sd - L.nodeR - 6));
    ctx.stroke();
  }

  drawHub(ctx, s, T, w);
  drawBoard(ctx, s, T, w);
  for (const [name, i] of slotOf) drawWorker(ctx, s, name, L.slots[i], T, w);
  drawFlights(ctx, s, T, speed);
  const vg = ctx.createRadialGradient(L.cx, L.cy, L.R * 0.7, L.cx, L.cy, Math.hypot(L.swarmW, L.swarmH) * 0.62);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, C.dark ? 'rgba(0,0,0,0.45)' : 'rgba(40,70,90,0.08)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, L.swarmW, L.swarmH);
  drawNotes(ctx, s, T, w);
  updateHeader(s, T);
  return s;
}

function drawHub(ctx, s, T, w) {
  const { cx, cy, hub } = L;
  ctx.fillStyle = C['bg-hub'];
  ctx.beginPath(); ctx.arc(cx, cy, hub - 8, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = C['line-strong'];
  ctx.lineWidth = 1;
  ctx.stroke();

  // budget ring: solid = left, hatched = reserved, track = spent
  const r = hub, lw = Math.max(5, hub * 0.07);
  const start = -Math.PI / 2;
  const fl = s.left / s.budget, fr = s.reservedSum / s.budget;
  ctx.lineCap = 'butt';
  ctx.lineWidth = lw;
  ctx.strokeStyle = C.dark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.06)';
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
  const low = fl < 0.15;
  ctx.strokeStyle = low ? C.amber : C.cyan;
  ctx.beginPath(); ctx.arc(cx, cy, r, start, start + fl * Math.PI * 2); ctx.stroke();
  if (fr > 0) {
    const a0 = start + fl * Math.PI * 2, a1 = a0 + fr * Math.PI * 2;
    ctx.strokeStyle = alpha(C.cyan, 0.35);
    ctx.beginPath(); ctx.arc(cx, cy, r, a0, a1); ctx.stroke();
    ctx.strokeStyle = C.cyan;
    ctx.lineWidth = 1.2;
    const steps = Math.max(1, Math.floor(((a1 - a0) * r) / 5));
    for (let i = 0; i <= steps; i++) {
      const a = a0 + ((a1 - a0) * i) / steps;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * (r - lw / 2), cy + Math.sin(a) * (r - lw / 2));
      ctx.lineTo(cx + Math.cos(a + 0.03) * (r + lw / 2), cy + Math.sin(a + 0.03) * (r + lw / 2));
      ctx.stroke();
    }
  }
  // budget tick at the start
  ctx.fillStyle = C.text;
  ctx.fillRect(cx - 1, cy - r - lw, 2, lw * 2);

  // planner or, when the run is done and the queue empty, the cat mark
  const P = L.planner;
  const pr = Math.max(18, hub * 0.24);
  if (s.ended && s.queue.length === 0 && mark.complete && mark.naturalWidth) {
    const mw = hub * 0.9, mh = (mw * mark.naturalHeight) / mark.naturalWidth;
    ctx.drawImage(mark, cx - mw / 2, cy - mh / 2 - 4, mw, mh);
    ctx.font = '600 11px Inter';
    ctx.textAlign = 'center';
    ctx.fillStyle = C.muted;
    ctx.fillText(fx.records[fx.records.length - 1].outcome || 'done', cx, cy + mh / 2 + 10);
  } else {
    const pa = s.agents.get('planner');
    if (pa && pa.thinking) pulse(ctx, P.x, P.y, pr, T, pa.thinking.reserve * 2);
    ctx.fillStyle = C.node;
    ctx.strokeStyle = C.cyan;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(P.x, P.y, pr, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = C.text;
    ctx.font = `600 ${Math.round(pr * 0.42)}px Inter`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('planner', P.x, P.y + 1);

    // queue tray
    const cols = 8, cell = Math.max(6, Math.min(11, hub * 0.095)), gap = cell * 0.35;
    const tw = cols * cell + (cols - 1) * gap;
    const x0 = L.tray.x - tw / 2, y0 = L.tray.y - cell;
    const shown = s.queue.slice(0, cols * 4);
    shown.forEach((id, i) => {
      let x = x0 + (i % cols) * (cell + gap), y = y0 + Math.floor(i / cols) * (cell + gap);
      const t = s.tasks.get(id);
      // the hop into the tray is short, so it stays short at any speed
      const p = (T - postedT.get(id) - i * 0.03) / Math.min(w * 1.2, 3.5);
      if (p < 0 && !(t && t.attempt > 0)) return;
      let sz = cell;
      if (p >= 0 && p < 1 && !(t && t.attempt > 0)) {
        const q = ease(p);
        x = L.planner.x - cell / 2 + (x - L.planner.x + cell / 2) * q;
        y = L.planner.y - cell / 2 + (y - L.planner.y + cell / 2) * q - Math.sin(q * Math.PI) * 18;
        sz = cell * (0.6 + 0.4 * q);
        ctx.shadowColor = C.cyan; ctx.shadowBlur = 12;
      }
      ctx.fillStyle = t && t.attempt > 0 ? C.amber : C.cyan;
      roundRect(ctx, x, y, sz, sz, 2); ctx.fill();
      ctx.shadowBlur = 0;
    });
    if (s.queue.length === 0) {
      ctx.strokeStyle = C['line-strong'];
      ctx.setLineDash([3, 3]);
      roundRect(ctx, x0, y0, tw, cell, 3); ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.font = '500 10.5px "JetBrains Mono"';
    ctx.fillStyle = C.muted;
    ctx.textBaseline = 'alphabetic';
    const rows = Math.max(1, Math.ceil(shown.length / cols));
    ctx.fillText(`queue ${s.queue.length}`, cx, y0 + rows * (cell + gap) + 12);
  }
  // budget label below the ring
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.font = '600 13px "JetBrains Mono"';
  ctx.fillStyle = low ? C.amber : C.text;
  ctx.fillText(money(s.left), cx, cy + r + 24);
  ctx.font = '500 10.5px Inter';
  ctx.fillStyle = C.muted;
  ctx.fillText(`left of ${money(s.budget)}` + (s.reservedSum > 0 ? ` · ${money(s.reservedSum)} reserved` : ''), cx, cy + r + 38);
  hits.push({ kind: 'planner', x: P.x, y: P.y, r: pr + 6 });
}

function pulse(ctx, x, y, r, T, weight) {
  const k = clamp(weight, 0.3, 1.6);
  for (let i = 0; i < 2; i++) {
    const ph = ((WALL * 0.8 + i * 0.5) % 1);
    ctx.strokeStyle = alpha(C.cyan, (1 - ph) * 0.45);
    ctx.lineWidth = 1.5 + k;
    ctx.beginPath(); ctx.arc(x, y, r + 4 + ph * 12 * k, 0, Math.PI * 2); ctx.stroke();
  }
}

function drawWorker(ctx, s, name, sl, T, w) {
  const a = s.agents.get(name);
  const r = L.nodeR;
  const { x, y } = sl;
  if (!a || !a.up) {
    ctx.strokeStyle = C.line;
    ctx.setLineDash([3, 4]);
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    return;
  }
  const gone = !!a.gone;
  const joinP = clamp((T - a.upT) / w);
  const scale = 0.6 + 0.4 * ease(joinP);
  const rr = r * scale;
  hits.push({ kind: 'agent', name, x, y, r: r + 8 });

  if (a.thinking && !gone) pulse(ctx, x, y, rr, T, a.thinking.reserve * 2.6);
  // refused: red ring that holds for a while, then a badge
  const sinceRef = T - a.refusedT;
  if (sinceRef >= 0 && sinceRef < w * 3) {
    const p = sinceRef / (w * 3);
    ctx.strokeStyle = alpha(C.red, 0.9 * (1 - p));
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, y, rr + 6 + p * 14, 0, Math.PI * 2); ctx.stroke();
  }

  ctx.globalAlpha = gone ? 0.5 : 1;
  const ring = gone ? C.muted : a.refused ? C.red : a.task ? C.cyan : C['line-strong'];
  const body = ctx.createRadialGradient(x - rr * 0.35, y - rr * 0.45, rr * 0.1, x, y, rr);
  body.addColorStop(0, C.dark ? (a.task && !gone ? '#1b3546' : '#18242f') : '#ffffff');
  body.addColorStop(1, C.dark ? '#0b131b' : '#e9f0f5');
  ctx.fillStyle = body;
  if ((a.task || a.thinking) && !gone) { ctx.shadowColor = a.refused ? C.red : C.cyan; ctx.shadowBlur = C.dark ? 22 : 10; }
  ctx.beginPath(); ctx.arc(x, y, rr, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = ring;
  ctx.lineWidth = a.task || a.refused ? 2 : 1.5;
  if (gone) ctx.setLineDash([4, 3]);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle = C.dark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.05)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(x, y, rr - 4, 0, Math.PI * 2); ctx.stroke();
  if (gone) {
    ctx.strokeStyle = C.amber; ctx.lineWidth = 1.4; ctx.globalAlpha = 0.55;
    ctx.beginPath();
    ctx.moveTo(x - rr * 0.2, y - rr); ctx.lineTo(x + rr * 0.05, y - rr * 0.45); ctx.lineTo(x - rr * 0.18, y - rr * 0.1);
    ctx.lineTo(x + rr * 0.22, y + rr * 0.35); ctx.lineTo(x + rr * 0.05, y + rr * 0.98);
    ctx.moveTo(x + rr * 0.05, y - rr * 0.45); ctx.lineTo(x + rr * 0.5, y - rr * 0.62);
    ctx.stroke();
    ctx.globalAlpha = 0.85;
  }
  ctx.fillStyle = gone ? C.muted : C.text;
  ctx.font = `700 ${Math.round(rr * 0.56)}px Inter`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(gone ? 'x' + name.slice(1) : name, x, y + 1);
  ctx.globalAlpha = 1;

  // death flash
  if (gone) {
    const p = (T - a.goneT) / (w * 2);
    if (p >= 0 && p < 1) {
      ctx.strokeStyle = alpha(C.amber, 1 - p);
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, rr + 4 + p * 22, 0, Math.PI * 2); ctx.stroke();
    }
  }

  // claim timer
  const held = a.task;
  if (held) {
    const left = clamp((a.deadline - T) / VIS);
    const ar = rr + 6;
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.strokeStyle = C.dark ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.07)';
    ctx.beginPath(); ctx.arc(x, y, ar, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = gone ? C.amber : C.cyan;
    ctx.beginPath(); ctx.arc(x, y, ar, -Math.PI / 2, -Math.PI / 2 + left * Math.PI * 2); ctx.stroke();
    ctx.lineCap = 'butt';
  }

  // labels outside the ring, away from the hub
  if (SLOTS > 16) return;
  if (L.narrow) {
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.font = '600 10px "JetBrains Mono"';
    ctx.fillStyle = gone || a.lost ? C.amber : held ? C.cyan : C.muted;
    ctx.fillText(held || a.lost || (gone ? 'gone' : 'idle'), x, y + rr + 10);
    return;
  }
  const dx = Math.cos(sl.a), dy = Math.sin(sl.a);
  const lx = x + dx * (rr + 16), ly = y + dy * (rr + 16);
  ctx.textAlign = Math.abs(dx) < 0.3 ? 'center' : dx > 0 ? 'left' : 'right';
  ctx.textBaseline = dy < -0.3 ? 'bottom' : dy > 0.3 ? 'top' : 'middle';
  const lines = [];
  if (held) {
    const tsk = fx.tasks[held];
    lines.push([gone ? C.amber : C.cyan, '600 11px "JetBrains Mono"', `${held} ${base(tsk.title)}`]);
    if (gone) lines.push([C.amber, '500 10.5px "JetBrains Mono"', `claim lapses in ${Math.max(0, a.deadline - T).toFixed(0)}s`]);
  } else if (a.lost) {
    lines.push([C.amber, '600 11px "JetBrains Mono"', `${a.lost} claim lapsed`]);
  } else if (gone) {
    lines.push([C.muted, '500 11px Inter', 'gone']);
  } else {
    lines.push([C.muted, '500 11px Inter', s.ended ? 'done' : 'idle']);
  }
  const sub = [`${money(a.spent)}`];
  if (a.refused) sub.push(`${a.refused} refused`);
  lines.push([a.refused ? C.red : C.muted, '500 10.5px "JetBrains Mono"', sub.join(' · ')]);
  const lh = 14;
  const order = dy < -0.3 ? [...lines].reverse() : lines;
  order.forEach(([col, font, text], i) => {
    ctx.fillStyle = col; ctx.font = font;
    const off = dy < -0.3 ? -i * lh : dy > 0.3 ? i * lh : (i - (order.length - 1) / 2) * lh;
    ctx.fillText(text, lx, ly + off);
  });
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawBoard(ctx, s, T, w) {
  const { bx, by, bw } = L;
  if (!L.narrow) {
    ctx.fillStyle = C.panel;
    ctx.fillRect(L.swarmW, 0, L.boardW, L.H);
    ctx.fillStyle = C.line;
    ctx.fillRect(L.swarmW, 0, 1, L.H);
  }
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = C.text;
  ctx.font = '700 14px Inter';
  ctx.fillText('Board', bx + 6, by + 16);
  ctx.font = '500 11px "JetBrains Mono"';
  ctx.fillStyle = C.muted;
  const locks = [...s.board.values()].filter((c) => c.lock).length;
  ctx.textAlign = 'right';
  ctx.fillText(`${s.board.size} keys · ${locks} locked`, bx + bw, by + 16);
  ctx.textAlign = 'left';

  const keys = cardOrder.filter((k) => s.board.has(k));
  const ch = L.cardH, gap = L.cardGap;
  const skip = Math.max(0, keys.length - L.maxCards);
  keys.slice(skip).forEach((k, i) => {
    const c = s.board.get(k);
    const y = L.cardsTop + i * (ch + gap);
    hits.push({ kind: 'card', key: k, x: bx, y, w: bw, h: ch });
    const placeholder = c.text == null;
    const putP = (T - c.putT - w * 0.9) / (w * 2);
    const conflictP = (T - c.conflictT - w * 0.5) / (w * 2);
    const refusedP = (T - c.refusedT - w * 0.55) / (w * 3);
    let shake = 0;
    if (conflictP >= 0 && conflictP < 0.4) shake = Math.sin(conflictP * 60) * 3 * (1 - conflictP / 0.4);
    if (refusedP >= 0 && refusedP < 0.3) shake = Math.sin(refusedP * 70) * 4 * (1 - refusedP / 0.3);
    const x = bx + shake;
    ctx.fillStyle = C.card;
    roundRect(ctx, x, y, bw, ch, 8); ctx.fill();
    let border = C['line-strong'], bwid = 1;
    if (c.lock) { border = alpha(C.cyan, 0.55); bwid = 1.2; }
    if (putP >= 0 && putP < 1) { border = alpha(C.cyan, 1 - putP * 0.6); bwid = 2; }
    if (conflictP >= 0 && conflictP < 1) { border = alpha(C.amber, 1 - conflictP * 0.5); bwid = 2; }
    if (refusedP >= 0 && refusedP < 1) { border = alpha(C.red, 1 - refusedP * 0.4); bwid = 2.5; }
    ctx.strokeStyle = border; ctx.lineWidth = bwid;
    if (placeholder) ctx.setLineDash([4, 3]);
    roundRect(ctx, x, y, bw, ch, 8); ctx.stroke();
    ctx.setLineDash([]);
    if (putP >= 0 && putP < 1) {
      ctx.fillStyle = alpha(C.cyan, 0.12 * (1 - putP));
      roundRect(ctx, x, y, bw, ch, 8); ctx.fill();
    }

    const pad = 12;
    ctx.font = '600 11.5px "JetBrains Mono"';
    ctx.fillStyle = k.startsWith('plan') ? C.text : C.cyan;
    const title = k;
    ctx.fillText(title, x + pad, y + (L.narrow ? 14 : 17));
    if (!L.narrow) {
      ctx.font = '500 11.5px Inter';
      ctx.fillStyle = placeholder ? C.muted : C.text;
      const txt = placeholder ? 'lease taken, nothing written yet' : c.text;
      ctx.fillText(fit(ctx, txt, bw - pad * 2 - 40), x + pad, y + 33);
    }
    // version and writer
    ctx.textAlign = 'right';
    ctx.font = '500 11px "JetBrains Mono"';
    ctx.fillStyle = C.muted;
    let rx = x + bw - pad;
    if (c.v != null) { ctx.fillText(`v${c.v}`, rx, y + (L.narrow ? 14 : 17)); }
    // lock badge
    if (c.lock) {
      const left = clamp(1 - (T - c.lock.t) / c.lock.ttl);
      const ly = y + (L.narrow ? 26 : 32), lx = x + bw - pad - 6;
      ctx.lineWidth = 2.2;
      ctx.strokeStyle = alpha(C.cyan, 0.2);
      ctx.beginPath(); ctx.arc(lx, ly - 4, 6.5, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = C.cyan;
      ctx.beginPath(); ctx.arc(lx, ly - 4, 6.5, -Math.PI / 2, -Math.PI / 2 + left * Math.PI * 2); ctx.stroke();
      lockIcon(ctx, lx, ly - 4, C.cyan);
      ctx.font = '600 11px "JetBrains Mono"';
      ctx.fillStyle = C.cyan;
      ctx.fillText(c.lock.holder, lx - 12, ly);
    } else if (c.lostT > -1e9 && T - c.lostT < w * 6) {
      ctx.font = '600 11px "JetBrains Mono"';
      ctx.fillStyle = C.amber;
      ctx.fillText('lease expired', x + bw - pad, y + (L.narrow ? 26 : 33));
    }
    if (refusedP >= -0.2 && refusedP < 1.6) {
      ctx.font = '700 11px Inter';
      ctx.fillStyle = C.red;
      ctx.fillText('write refused', x + bw - pad, y + (L.narrow ? 26 : 33));
    }
    ctx.textAlign = 'left';
  });
  if (!L.narrow) drawLog(ctx, s, T);
}

function lockIcon(ctx, x, y, col) {
  ctx.fillStyle = col;
  ctx.fillRect(x - 2.5, y - 0.5, 5, 4);
  ctx.strokeStyle = col; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(x, y - 1, 1.8, Math.PI, 0); ctx.stroke();
}

function fit(ctx, text, max) {
  if (ctx.measureText(text).width <= max) return text;
  let t = text;
  while (t.length > 1 && ctx.measureText(t + '…').width > max) t = t.slice(0, -1);
  return t + '…';
}

const KIND_TONE = {
  refused: 'red', board_conflict: 'amber', lease_lost: 'amber', agent_gone: 'amber', task_dead: 'amber',
  task_released: 'amber', task_duplicate: 'amber', message: 'violet', task_done: 'result', task_claimed: 'cyan', task_posted: 'cyan',
};

function drawLog(ctx, s, T) {
  const top = L.logTop;
  const { bx, bw } = L;
  ctx.fillStyle = C.line;
  ctx.fillRect(bx, top - 14, bw, 1);
  ctx.font = '700 12px Inter'; ctx.fillStyle = C.text; ctx.textAlign = 'left';
  ctx.fillText('Run log', bx + 6, top + 4);
  ctx.font = '500 11px "JetBrains Mono"'; ctx.fillStyle = C.muted; ctx.textAlign = 'right';
  ctx.fillText(`agents.log.${fx.run}`, bx + bw, top + 4);
  ctx.textAlign = 'left';
  const shown = [];
  for (let i = events.length - 1; i >= 0 && shown.length < L.logRows; i--) {
    const e = events[i];
    if (e.t > T || e.o == null) continue;
    if (['task_extended', 'lease_renewed', 'model_started'].includes(e.kind)) continue;
    shown.push(e);
  }
  shown.forEach((e, i) => {
    const y = top + 24 + i * 18;
    const tone = KIND_TONE[e.kind];
    ctx.globalAlpha = 1 - i * 0.08;
    ctx.font = '500 11px "JetBrains Mono"';
    ctx.fillStyle = C.muted;
    ctx.fillText(String(e.o).padStart(3, ' '), bx + 6, y);
    ctx.fillStyle = C.text;
    ctx.fillText(e.pub === 'agents-run' ? (e.agent || 'runtime') : e.pub, bx + 40, y);
    ctx.fillStyle = tone ? C[tone] : C.muted;
    ctx.fillText(e.kind, bx + 108, y);
    ctx.fillStyle = C.muted;
    ctx.fillText(fit(ctx, detail(e), bw - 228), bx + 228, y);
    ctx.globalAlpha = 1;
  });
}

function detail(e) {
  switch (e.kind) {
    case 'task_posted': return `${e.task} ${base(e.title)}`;
    case 'task_claimed': return `${e.task} #${e.attempt}`;
    case 'task_done': case 'task_duplicate': case 'task_released': case 'task_dead': return e.task;
    case 'board_put': case 'board_conflict': case 'lease_taken': case 'lease_released': case 'lease_lost': return e.key;
    case 'message': return `→ ${e.to}`;
    case 'model_call': return `${(e.tokens / 1000).toFixed(1)}k ${money(e.cost)}`;
    case 'refused': return e.key || e.op;
    case 'agent_up': case 'agent_gone': return e.agent;
    default: return '';
  }
}

function shapeAt(ctx, cls, x, y, size, n) {
  const col = { post: C.cyan, claim: C.cyan, back: C.amber, dead: C.amber, result: C.result, dup: C.result, write: C.result, conflict: C.amber, refused: C.red, msg: C.violet }[cls];
  ctx.fillStyle = col;
  ctx.shadowColor = col;
  ctx.shadowBlur = C.dark ? 16 : 6;
  if (cls === 'result' || cls === 'dup') {
    ctx.beginPath(); ctx.arc(x, y, size * 0.6, 0, Math.PI * 2); ctx.fill();
  } else if (cls === 'msg') {
    ctx.beginPath(); ctx.moveTo(x, y - size * 0.75); ctx.lineTo(x + size * 0.75, y); ctx.lineTo(x, y + size * 0.75); ctx.lineTo(x - size * 0.75, y); ctx.closePath(); ctx.fill();
  } else if (cls === 'write' || cls === 'conflict' || (cls === 'refused')) {
    roundRect(ctx, x - size * 0.75, y - size * 0.45, size * 1.5, size * 0.9, 2); ctx.fill();
  } else {
    roundRect(ctx, x - size / 2, y - size / 2, size, size, 2); ctx.fill();
  }
  ctx.shadowBlur = 0;
  if (n > 1) badge(ctx, x + size * 0.6, y - size * 0.6 - 8, '×' + n, col);
}

function badge(ctx, x, y, label, col) {
  ctx.font = '700 11px "JetBrains Mono"';
  const tw = ctx.measureText(label).width + 12;
  ctx.fillStyle = col;
  ctx.shadowColor = col; ctx.shadowBlur = 10;
  roundRect(ctx, x, y - 9, tw, 18, 9); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = C.dark ? '#061017' : '#fff';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, x + tw / 2, y + 0.5);
}

function drawFlights(ctx, s, T, speed) {
  const w = FLIGHT * speed;
  const fl = flightsFor(speed);
  const active = [];
  for (const f of fl) {
    const dur = f.cls === 'refused' || f.cls === 'conflict' ? w * 2 : f.cls === 'dead' ? w * 1.8 : w;
    const p = (T - f.t) / dur;
    if (p >= 0 && p < 1) active.push([f, p, dur]);
  }
  const flow = active.length > FLOW_AT;
  if (flow) {
    const per = new Map();
    for (const a of active) { const k = a[0].from + '|' + a[0].to; per.set(k, (per.get(k) || []).concat([a])); }
    for (const [k, list] of per) {
      if (list.length < 2) continue;
      const e = edge(list[0][0].from, list[0][0].to);
      ctx.strokeStyle = alpha(C.cyan, 0.7); ctx.lineWidth = 2; ctx.setLineDash([6, 8]);
      ctx.lineDashOffset = -T * 40 * Math.log2(list.length + 1);
      ctx.beginPath(); ctx.moveTo(e.a.x, e.a.y); ctx.quadraticCurveTo(e.c.x, e.c.y, e.b.x, e.b.y); ctx.stroke();
      ctx.setLineDash([]);
      const m = bez(e, 0.5);
      ctx.font = '600 11px "JetBrains Mono"'; ctx.fillStyle = C.text; ctx.textAlign = 'center';
      ctx.fillText(String(list.reduce((n, a) => n + a[0].n, 0)), m.x, m.y - 6);
      list.forEach((a) => (a.skip = true));
    }
  }
  for (const f of fl) {
    const k = (T - f.t - w) / (w * 1.4);
    if (k < 0 || k >= 1) continue;
    const big = f.n > 4 || (f.cls === 'claim' && f.ev.attempt > 1);
    if (f.cls === 'claim') ripple(ctx, pos(f.to), k, C.cyan, L.nodeR + 2, big);
    else if (f.cls === 'result') ripple(ctx, L.planner, k, C.result, Math.max(18, L.hub * 0.24), big);
    else if (f.cls === 'back') ripple(ctx, L.tray, k, C.amber, 20, true);
    else if (f.cls === 'msg') ripple(ctx, pos(f.to), k, C.violet, L.nodeR, false);
    else if (f.cls === 'post') ripple(ctx, L.tray, k, C.cyan, 24, f.n > 4);
  }
  // callouts: the beats worth a label at the spot where they happen
  for (const f of fl) {
    let at = null, text = '', col = C.red, k = -1;
    if (f.cls === 'refused') {
      const hitT = f.t + 0.42 * 2 * w;
      k = (T - hitT) / (w * 3.2);
      if (k < 0 || k >= 1) continue;
      const e = edge(f.from, f.to, f.cls);
      at = bez(e, 0.985);
      text = f.ev.op === 'task_post' ? 'refused · no publish on tasks' : `refused · no grant on plan-*`;
    } else if (f.cls === 'claim' && f.ev.attempt > 1) {
      k = (T - f.t - w) / (w * 3);
      if (k < 0 || k >= 1) continue;
      at = pos(f.to); col = C.cyan;
      text = `${f.ev.task} · attempt ${f.ev.attempt}`;
    } else continue;
    const a = k < 0.1 ? k / 0.1 : k > 0.8 ? (1 - k) / 0.2 : 1;
    ctx.globalAlpha = a;
    ctx.font = '700 12px Inter';
    const tw = ctx.measureText(text).width + 22;
    let x = at.x - tw / 2, y = at.y - 44 - (1 - Math.min(1, k * 5)) * 6;
    if (f.to.startsWith('card:')) { x = at.x - tw - 26; y = at.y - 13; }
    else if (f.cls === 'refused') { x = at.x - tw / 2 + 30; y = at.y - 78; }
    else {
      const dx = L.cx - at.x, dy = L.cy - at.y, d = Math.hypot(dx, dy);
      const ix = at.x + (dx / d) * (L.nodeR + 34), iy = at.y + (dy / d) * (L.nodeR + 34);
      x = ix - tw / 2; y = iy - 13;
    }
    ctx.fillStyle = col;
    ctx.shadowColor = col; ctx.shadowBlur = 18;
    roundRect(ctx, x, y, tw, 26, 13); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, x + tw / 2, y + 13.5);
    ctx.globalAlpha = 1;
  }
  for (const a of active) {
    if (a.skip) continue;
    const [f, p, dur] = a;
    const e = edge(f.from, f.to, f.cls);
    const size = 11 + 3.2 * Math.log2(f.n);
    if (reduced) {
      ctx.strokeStyle = alpha(f.cls === 'refused' ? C.red : f.cls === 'msg' ? C.violet : C.cyan, 0.8 * (1 - p));
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(e.a.x, e.a.y); ctx.quadraticCurveTo(e.c.x, e.c.y, e.b.x, e.b.y); ctx.stroke();
      continue;
    }
    let q = ease(p), fade = 1, pt;
    if (f.cls === 'refused' || f.cls === 'conflict') {
      // out to the target, then bounce back part of the way
      const hit = 0.42;
      if (p < hit) q = ease(p / hit) * 0.97;
      else q = 0.97 - 0.35 * Math.sin(((p - hit) / (1 - hit)) * Math.PI / 2);
      fade = p < hit ? 1 : 1 - (p - hit) / (1 - hit);
      if (p >= hit) {
        const at = bez(e, 0.985), from = bez(e, 0.9);
        impact(ctx, at, (p - hit) / (1 - hit), f.cls === 'refused' ? C.red : C.amber, Math.atan2(from.y - at.y, from.x - at.x), f.cls === 'refused');
      }
    } else if (f.cls === 'dup') {
      q = ease(Math.min(p, 0.55));
      fade = p < 0.35 ? 1 : clamp(1 - (p - 0.35) / 0.25);
    }
    if (f.cls === 'post') {
      if (f.n > 1) {
        const pt2 = bez(e, ease(p));
        ctx.globalAlpha = 1 - p * p;
        badge(ctx, pt2.x + 34, pt2.y - 14, '×' + f.n, C.cyan);
        ctx.globalAlpha = 1;
      }
      continue;
    }
    if (f.cls === 'dead' && p > 0.55) {
      const b = e.b, k = (p - 0.55) / 0.45;
      pt = { x: b.x, y: b.y + k * k * L.hub * 0.9 };
      fade = 1 - k;
    } else {
      pt = bez(e, f.cls === 'dead' ? ease(p / 0.55) : q);
    }
    if (fade <= 0) continue;
    ctx.globalAlpha = fade;
    // trail
    const tp = Math.max(0, q - 0.24);
    if (f.cls !== 'dead' || p <= 0.55) {
      const t0 = bez(e, tp);
      const grad = ctx.createLinearGradient(t0.x, t0.y, pt.x, pt.y);
      const col = { msg: C.violet, refused: C.red, back: C.amber, conflict: C.amber, dead: C.amber, result: C.result, dup: C.result, write: C.result }[f.cls] || C.cyan;
      grad.addColorStop(0, alpha(col, 0)); grad.addColorStop(1, alpha(col, 0.75));
      ctx.strokeStyle = grad; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(t0.x, t0.y);
      for (let j = 1; j <= 8; j++) { const m = bez(e, tp + ((q - tp) * j) / 8); ctx.lineTo(m.x, m.y); }
      ctx.stroke(); ctx.lineCap = 'butt';
    }
    shapeAt(ctx, f.cls, pt.x, pt.y, f.cls === 'write' ? 8 : size, f.n);
    ctx.globalAlpha = 1;
  }
}

function impact(ctx, at, k, col, dir, strong) {
  if (k > 1) return;
  const fade = 1 - k;
  // flash
  const fr = (strong ? 46 : 30) * (0.6 + 0.4 * fade);
  const g = ctx.createRadialGradient(at.x, at.y, 0, at.x, at.y, fr);
  g.addColorStop(0, alpha(col, 0.55 * fade)); g.addColorStop(1, alpha(col, 0));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(at.x, at.y, fr, 0, Math.PI * 2); ctx.fill();
  // shield facing the sender
  ctx.save();
  ctx.shadowColor = col; ctx.shadowBlur = 16;
  ctx.strokeStyle = alpha(col, fade);
  ctx.lineWidth = strong ? 4 : 3;
  ctx.lineCap = 'round';
  const sr = strong ? 20 : 15;
  ctx.beginPath(); ctx.arc(at.x - Math.cos(dir) * 6, at.y - Math.sin(dir) * 6, sr, dir - 1.05, dir + 1.05); ctx.stroke();
  ctx.restore();
  if (strong && k < 0.75) {
    const lx = at.x - Math.cos(dir) * 6, ly = at.y - Math.sin(dir) * 6;
    ctx.globalAlpha = fade;
    ctx.fillStyle = col;
    ctx.fillRect(lx - 4.5, ly - 1, 9, 7);
    ctx.strokeStyle = col; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.arc(lx, ly - 1.5, 3.2, Math.PI, 0); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // shards thrown back toward the sender
  ctx.fillStyle = alpha(col, fade);
  for (let i = 0; i < (strong ? 12 : 7); i++) {
    const r1 = ((i * 73) % 17) / 17, r2 = ((i * 29) % 11) / 11;
    const ang = dir + (r1 - 0.5) * 2.4;
    const d = 8 + k * (26 + 34 * r2);
    const px = at.x + Math.cos(ang) * d, py = at.y + Math.sin(ang) * d;
    const sz = 2 + 3 * r2 * fade;
    ctx.save(); ctx.translate(px, py); ctx.rotate(ang + k * 6 * (r1 - 0.5));
    ctx.beginPath(); ctx.moveTo(-sz, -sz * 0.6); ctx.lineTo(sz, 0); ctx.lineTo(-sz, sz * 0.6); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

function ripple(ctx, at, k, col, r0, big) {
  if (k < 0 || k >= 1) return;
  const e = 1 - Math.pow(1 - k, 3);
  ctx.strokeStyle = alpha(col, 0.75 * (1 - k));
  ctx.lineWidth = big ? 2.5 : 1.8;
  ctx.beginPath(); ctx.arc(at.x, at.y, r0 + e * (big ? 34 : 22), 0, Math.PI * 2); ctx.stroke();
  if (big) {
    ctx.strokeStyle = alpha(col, 0.4 * (1 - k));
    ctx.beginPath(); ctx.arc(at.x, at.y, r0 + e * 18, 0, Math.PI * 2); ctx.stroke();
  }
}

function wrap(ctx, text, max) {
  const words = text.split(' ');
  const lines = [''];
  for (const wd of words) {
    const t = lines[lines.length - 1] ? lines[lines.length - 1] + ' ' + wd : wd;
    if (ctx.measureText(t).width > max && lines[lines.length - 1]) lines.push(wd); else lines[lines.length - 1] = t;
  }
  return lines.slice(0, 3);
}

function drawNotes(ctx, s, T, w) {
  const keep = w * 6;
  if (L.narrow) {
    const n = s.notes.filter((n) => T - n.t < keep && T >= n.t).pop();
    if (!n) return;
    const col = C[n.tone] || C.cyan;
    const y0 = L.swarmH + 4, h = 34;
    ctx.fillStyle = C.dark ? 'rgba(12, 19, 27, 0.92)' : 'rgba(255,255,255,0.94)';
    roundRect(ctx, 10, y0, L.W - 20, h, 8); ctx.fill();
    ctx.strokeStyle = alpha(col, 0.45); ctx.lineWidth = 1;
    roundRect(ctx, 10, y0, L.W - 20, h, 8); ctx.stroke();
    ctx.fillStyle = col; roundRect(ctx, 10, y0 + 7, 3, h - 14, 1.5); ctx.fill();
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.font = '500 12px Inter'; ctx.fillStyle = C.text;
    ctx.fillText(fit(ctx, n.text, L.W - 44), 22, y0 + h / 2);
    return;
  }
  const notes = s.notes.filter((n) => T - n.t < keep && T >= n.t).slice(-4);
  const maxW = L.narrow ? L.W - 32 : Math.min(300, L.cx - L.R - 40);
  let y = L.swarmH - 18;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  for (let i = notes.length - 1; i >= 0; i--) {
    const n = notes[i];
    const age = (T - n.t) / keep;
    const intro = clamp((T - n.t) / (w * 0.5));
    ctx.font = '500 12.5px Inter';
    const lines = wrap(ctx, n.text, maxW - 26);
    const h = 30 + lines.length * 17;
    const top = y - h;
    ctx.globalAlpha = (age > 0.8 ? (1 - age) * 5 : 1) * intro;
    const col = C[n.tone] || C.cyan;
    ctx.fillStyle = C.dark ? 'rgba(12, 19, 27, 0.92)' : 'rgba(255,255,255,0.94)';
    roundRect(ctx, 16, top, maxW, h, 9); ctx.fill();
    ctx.strokeStyle = alpha(col, 0.45); ctx.lineWidth = 1;
    roundRect(ctx, 16, top, maxW, h, 9); ctx.stroke();
    ctx.fillStyle = col;
    roundRect(ctx, 16, top + 8, 3, h - 16, 1.5); ctx.fill();
    ctx.font = '600 10.5px "JetBrains Mono"'; ctx.fillStyle = col;
    ctx.fillText(mmss(n.t).slice(0, 5), 30, top + 19);
    ctx.font = '500 12.5px Inter'; ctx.fillStyle = C.text;
    lines.forEach((ln, j) => ctx.fillText(ln, 30, top + 37 + j * 17));
    ctx.globalAlpha = 1;
    y = top - 8;
  }
}

// ---------- header ----------

let headerKey = '';
function updateHeader(s, T) {
  const workers = [...s.agents.values()].filter((a) => a.name !== 'planner' && a.up);
  const alive = workers.filter((a) => !a.gone).length;
  const total = Object.keys(fx.tasks).length;
  const k = [alive, workers.length, s.done, s.dead, s.left.toFixed(2)].join('|');
  if (k === headerKey) return;
  headerKey = k;
  document.getElementById('sWorkers').innerHTML = `${alive}<i>/${workers.length}</i>`;
  document.getElementById('sTasks').innerHTML = `${s.done}<i>/${total}</i>` + (s.dead ? ` <em>${s.dead} dead</em>` : '');
  const b = document.getElementById('sBudget');
  b.textContent = money(s.left);
  b.style.color = s.left / s.budget < 0.15 ? 'var(--amber)' : '';
}
document.getElementById('runTitle').textContent = fx.title;
document.getElementById('runGoal').textContent = fx.goal;
document.getElementById('runId').textContent = fx.run;

// ---------- timeline ----------

const lanes = ['planner', ...slotOf.keys()];
const spans = [];
const marks = [];
{
  const open = new Map();
  for (const e of events) {
    const who = e.kind === 'model_started' || e.kind === 'model_call' ? e.agent : e.pub;
    if (e.kind === 'task_claimed') open.set(e.task + who, { who, t0: e.t, kind: 'claim' });
    if (['task_done', 'task_released', 'task_dead', 'lapse', 'task_duplicate'].includes(e.kind)) {
      const sp = open.get(e.task + who);
      if (sp) { sp.t1 = e.t; spans.push(sp); open.delete(e.task + who); }
    }
    if (e.kind === 'model_started') open.set('m' + who, { who, t0: e.t, kind: 'model' });
    if (e.kind === 'model_call') { const sp = open.get('m' + who); if (sp) { sp.t1 = e.t; spans.push(sp); open.delete('m' + who); } }
    const tone = { refused: 'red', agent_gone: 'amber', lapse: 'amber', task_dead: 'amber', board_conflict: 'amber', task_duplicate: 'amber', lease_lost: 'amber' }[e.kind];
    if (tone) marks.push({ e, who: e.kind === 'agent_gone' ? e.agent : e.kind === 'lease_lost' ? e.holder : who, tone });
    if (e.kind === 'message') marks.push({ e, who, tone: 'violet', small: true });
  }
}
const spendCurve = [];
{
  let sp = 0;
  spendCurve.push([0, 0]);
  for (const e of events) if (e.kind === 'model_call') { sp += e.cost; spendCurve.push([e.t, sp]); }
}

let TL = {};
function drawTimeline(T, s) {
  const ctx = tctx;
  const W = tl.clientWidth, H = tl.clientHeight;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const gx = 64, gw = W - gx - 8;
  const top = 10;
  const laneH = Math.min(11, (H - top - 22) / lanes.length);
  TL = { gx, gw, top, laneH };
  const X = (t) => gx + (t / END) * gw;

  // spend against budget, behind the lanes
  const sh = lanes.length * laneH, sb = top + 4 + sh;
  ctx.beginPath();
  ctx.moveTo(X(0), sb);
  for (const [t, v] of spendCurve) ctx.lineTo(X(t), sb - (v / fx.budget) * sh);
  const lastV = spendCurve[spendCurve.length - 1][1];
  ctx.lineTo(X(END), sb - (lastV / fx.budget) * sh);
  ctx.lineTo(X(END), sb); ctx.closePath();
  ctx.fillStyle = alpha(C.amber, C.dark ? 0.07 : 0.06); ctx.fill();
  ctx.font = '500 9.5px "JetBrains Mono"'; ctx.textBaseline = 'middle';

  ctx.textAlign = 'right';
  lanes.forEach((name, i) => {
    const y = top + 4 + i * laneH;
    ctx.fillStyle = C.muted;
    if (lanes.length <= 16) ctx.fillText(name, gx - 10, y + laneH / 2);
    else if (i === 0 || i === Math.floor(lanes.length / 2)) ctx.fillText(i ? 'workers' : name, gx - 10, y + laneH / 2);
    ctx.fillStyle = C.dark ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.03)';
    ctx.fillRect(gx, y + 1, gw, laneH - 2);
  });
  for (const sp of spans) {
    const i = lanes.indexOf(sp.who);
    if (i < 0) continue;
    const y = top + 4 + i * laneH;
    ctx.fillStyle = sp.kind === 'model' ? alpha(C.cyan, 0.85) : alpha(C.cyan, 0.3);
    const h = sp.kind === 'model' ? laneH - 4 : laneH - 2;
    ctx.fillRect(X(sp.t0), y + (laneH - h) / 2, Math.max(1, X(sp.t1) - X(sp.t0)), h);
  }
  for (const m of marks) {
    const i = lanes.indexOf(m.who);
    if (i < 0) continue;
    const y = top + 4 + i * laneH + laneH / 2, x = X(m.e.t);
    ctx.fillStyle = C[m.tone];
    if (m.small) { ctx.fillRect(x - 1, y - 2, 2, 4); continue; }
    ctx.beginPath(); ctx.moveTo(x, y - 5); ctx.lineTo(x + 4, y); ctx.lineTo(x, y + 5); ctx.lineTo(x - 4, y); ctx.closePath(); ctx.fill();
  }
  // time axis
  ctx.fillStyle = C.muted; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  const axisY = top + 4 + lanes.length * laneH + 12;
  for (let t = 0; t <= END; t += 30) { ctx.fillText(mmss(t).slice(0, 5), X(t), axisY); }
  // playhead
  const px = X(T);
  ctx.fillStyle = alpha(C.cyan, 0.05);
  ctx.fillRect(gx, top + 4, px - gx, sh);
  ctx.strokeStyle = C.cyan; ctx.lineWidth = 2;
  ctx.shadowColor = C.cyan; ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.moveTo(px, top - 4); ctx.lineTo(px, axisY - 10); ctx.stroke();
  ctx.fillStyle = C.cyan;
  ctx.beginPath(); ctx.arc(px, top - 4, 5, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;

  const off = s.last ? s.last.o : 0;
  document.getElementById('clock').innerHTML = `${mmss(T)} <i>/ ${mmss(END)} · offset ${off}</i>`;
}

// ---------- step panel ----------

const panel = document.getElementById('panel');
function openStep(e) {
  if (!e) return;
  const rows = Object.entries(e).filter(([k]) => !['o', 't', 'pub', 'kind', 'prompt', 'response', 'result', 'derived'].includes(k));
  const call = e.kind === 'model_call' ? e : [...events].reverse().find((x) => x.kind === 'model_call' && x.t <= e.t && (x.agent === (e.agent || e.pub)) && (!e.task || x.task === e.task));
  const esc = (x) => String(x).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
  let html = `<h3><span>${esc(e.kind)}</span><button aria-label="Close">×</button></h3>
    <div class="meta mono">${e.o == null ? 'derived from the claim deadline' : 'offset ' + e.o} · ${mmss(e.t)} · ${esc(e.pub)}</div>
    <dl>${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(Array.isArray(v) ? v.join(', ') : v)}</dd>`).join('')}</dl>`;
  if (call) {
    const pr = fx.artifacts[call.prompt] || '', rs = fx.artifacts[call.response] || '';
    html += `<details${e.kind === 'model_call' || e.kind === 'refused' ? ' open' : ''}><summary>Prompt · <span class="mono">${esc(call.prompt.slice(0, 14))}…</span></summary><pre>${esc(pr)}</pre></details>
      <details><summary>Response · <span class="mono">${esc(call.response.slice(0, 14))}…</span> · ${(call.tokens / 1000).toFixed(1)}k tokens · ${money(call.cost)}</summary><pre>${esc(rs)}</pre></details>`;
  }
  html += `<div class="note">Publisher is what the broker recorded. Until felix-gateway passes it on, the viewer marks it unverified.</div>`;
  panel.innerHTML = html;
  panel.classList.add('open');
  panel.querySelector('button').onclick = () => panel.classList.remove('open');
}
function lastFor(pred) {
  for (let i = events.length - 1; i >= 0; i--) if (events[i].t <= play.T && pred(events[i])) return events[i];
  return null;
}
scene.addEventListener('click', (ev) => {
  const r = scene.getBoundingClientRect();
  const x = ev.clientX - r.left, y = ev.clientY - r.top;
  for (const h of hits) {
    const inside = h.r ? Math.hypot(x - h.x, y - h.y) < h.r : x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h;
    if (!inside) continue;
    if (h.kind === 'agent') return openStep(lastFor((e) => e.pub === h.name || e.agent === h.name || e.holder === h.name));
    if (h.kind === 'card') return openStep(lastFor((e) => e.key === h.key));
    if (h.kind === 'planner') return openStep(lastFor((e) => e.pub === 'planner' || e.agent === 'planner'));
  }
  panel.classList.remove('open');
});
scene.addEventListener('mousemove', (ev) => {
  const r = scene.getBoundingClientRect();
  const x = ev.clientX - r.left, y = ev.clientY - r.top;
  scene.style.cursor = hits.some((h) => (h.r ? Math.hypot(x - h.x, y - h.y) < h.r : x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h)) ? 'pointer' : 'default';
});

// ---------- playback ----------

const play = {
  T: params.has('t') ? clamp(+params.get('t'), 0, END) : 0,
  speed: +params.get('speed') > 0 ? +params.get('speed') : 8,
  playing: !params.has('t'),
};

const speedsEl = document.getElementById('speeds');
for (const sp of SPEEDS) {
  const b = document.createElement('button');
  b.textContent = sp + 'x';
  b.onclick = () => { play.speed = sp; syncButtons(); render(); };
  b.dataset.speed = sp;
  speedsEl.appendChild(b);
}
const liveBtn = document.createElement('button');
liveBtn.textContent = 'end';
liveBtn.title = 'Jump to the end of the run';
liveBtn.onclick = () => { play.T = END; play.playing = false; syncButtons(); render(); };
speedsEl.appendChild(liveBtn);
const playBtn = document.getElementById('play');
playBtn.onclick = () => { if (play.T >= END) play.T = 0; play.playing = !play.playing; syncButtons(); };
function syncButtons() {
  playBtn.textContent = play.playing ? '❚❚' : '▶';
  for (const b of speedsEl.querySelectorAll('button[data-speed]')) b.classList.toggle('on', +b.dataset.speed === play.speed);
}
syncButtons();

let dragging = false;
function seekFrom(ev) {
  const r = tl.getBoundingClientRect();
  const x = ev.clientX - r.left;
  play.T = clamp(((x - TL.gx) / TL.gw) * END, 0, END);
  render();
}
tl.addEventListener('pointerdown', (ev) => {
  const r = tl.getBoundingClientRect();
  const x = ev.clientX - r.left, y = ev.clientY - r.top;
  const X = (t) => TL.gx + (t / END) * TL.gw;
  const m = marks.find((m) => !m.small && Math.abs(X(m.e.t) - x) < 5 && Math.abs(TL.top + 4 + lanes.indexOf(m.who) * TL.laneH + TL.laneH / 2 - y) < 6);
  if (m) { play.T = m.e.t + 0.01; render(); openStep(m.e); return; }
  dragging = true; tl.setPointerCapture(ev.pointerId); seekFrom(ev);
});
tl.addEventListener('pointermove', (ev) => { if (dragging) seekFrom(ev); });
tl.addEventListener('pointerup', () => (dragging = false));
addEventListener('keydown', (ev) => {
  if (ev.code === 'Space') { ev.preventDefault(); playBtn.click(); }
  if (ev.code === 'ArrowRight') { play.T = clamp(play.T + 2, 0, END); render(); }
  if (ev.code === 'ArrowLeft') { play.T = clamp(play.T - 2, 0, END); render(); }
});

document.getElementById('theme').onclick = () => {
  root.dataset.theme = root.dataset.theme === 'light' ? 'dark' : 'light';
  localSet('fa-theme', root.dataset.theme);
  readPalette(); headerKey = ''; render();
};

const animTimes = rawFlights.map((f) => f.t).sort((a, b) => a - b);
function quiet(T, speed) {
  // nothing in flight and nothing due for 3 s: play the stretch at 10x
  const w = FLIGHT * speed * 2;
  const i = animTimes.findIndex((t) => t > T);
  const prev = i === -1 ? animTimes[animTimes.length - 1] : i > 0 ? animTimes[i - 1] : -Infinity;
  const next = i === -1 ? Infinity : animTimes[i];
  return T - prev > w && next - T > 3;
}

function render() {
  const s = drawScene(play.T, play.speed);
  drawTimeline(play.T, s);
}

let lastWall = null;
function tick(now) {
  if (lastWall != null && play.playing) {
    const dt = Math.min(0.1, (now - lastWall) / 1000);
    play.T += dt * play.speed * (quiet(play.T, play.speed) ? 10 : 1);
    if (play.T >= END) { play.T = END; play.playing = false; syncButtons(); }
  }
  lastWall = now;
  wallNow = now / 1000;
  render();
  requestAnimationFrame(tick);
}

layout();
addEventListener('resize', () => { layout(); render(); });
render();
// Frame-exact rendering for recordings: renderAt(T, speed) draws one frame.
window.renderAt = (T, speed, wall) => { wallNow = wall ?? null; play.playing = false; play.T = clamp(T, 0, END); play.speed = speed; syncButtons(); render(); return true; };
window.runEnd = END;
if (params.has('t')) { root.dataset.ready = '1'; }
else requestAnimationFrame(tick);
if (params.get('step')) {
  const e = events.find((x) => x.o === +params.get('step'));
  openStep(e);
}
</script>
</body>
</html>
